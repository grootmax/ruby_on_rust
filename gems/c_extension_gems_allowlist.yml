# Allowlist for C Extension Gems on Ruby on Rust
# Non-zero test exit codes or non-blocking divergences listed here will not fail CI runs.
#
# Format:
#   allowed_failures:
#     - gem: <gem_name>
#       reason: <description of known issue or flakiness>
#       non_blocking: true

allowed_failures:
  - gem: nokogiri
    reason: "Missing test dependencies (minitest/mock) and uninstalled bindir path in test_version.rb"
    non_blocking: true
  - gem: puma
    reason: "Missing optional test gem dependency (localhost/authority) in standalone fallback runner"
    non_blocking: true


