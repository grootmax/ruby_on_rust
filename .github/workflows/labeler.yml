name: "Pull Request Labeler"
# Ruby on Rust: upstream-only automation, run on demand only (owner decision
# 2026-10-07; see UPSTREAM.md). Upstream's original triggers are in git history.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
