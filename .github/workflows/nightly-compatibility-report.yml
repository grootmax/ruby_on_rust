name: Nightly Compatibility Report

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} / ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly-compatibility-report:
    name: Generate Nightly Compatibility Report
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /.github
          persist-credentials: true

      - uses: ./.github/actions/setup/ubuntu

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.1'
          bundler: none

      - uses: ./.github/actions/setup/directories
        with:
          srcdir: src
          builddir: build
          makeup: true
          clean: true

      - name: Run configure
        run: ../src/configure -C --disable-install-doc --with-rust-ports
        working-directory: build

      - name: Build
        run: make -j$(nproc)
        working-directory: build

      - name: Generate Compatibility Report
        run: ruby ../src/tool/generate_compatibility_report.rb --run
        working-directory: build

      - name: Check and Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add COMPATIBILITY.md tool/compatibility_results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update COMPATIBILITY.md [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "No changes to COMPATIBILITY.md"
          fi
        working-directory: src
