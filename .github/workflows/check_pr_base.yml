name: PR Base Branch Guardrail
# Enforces that all PRs target `claude/ruby-on-rust-v0.1` during Phase 1.
# PRs targeting `master` are rejected unless labeled `upstream-sync`.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check-base-branch:
    name: Validate Base Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Base Branch
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          echo "PR Base Branch: ${BASE_BRANCH}"
          echo "PR Labels: ${LABELS}"

          if [ "${BASE_BRANCH}" = "master" ]; then
            if echo "${LABELS}" | grep -qw "upstream-sync"; then
              echo "PR targets master but has 'upstream-sync' label. Allowing."
            else
              echo "::error::PRs targeting 'master' are prohibited during Phase 1. All C-to-Rust porting work must target 'claude/ruby-on-rust-v0.1' (unless labeled 'upstream-sync')."
              exit 1
            fi
          else
            echo "PR target branch '${BASE_BRANCH}' is valid."
          fi
