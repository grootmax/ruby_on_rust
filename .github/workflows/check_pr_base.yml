name: PR Base Branch Guardrail
# Enforces that all PRs target `master` or `claude/ruby-on-rust-v0.1` during Phase 1.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check-base-branch:
    name: Validate Base Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Base Branch
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          echo "PR Base Branch: ${BASE_BRANCH}"
          echo "PR Labels: ${LABELS}"

          if [ "${BASE_BRANCH}" = "master" ] || [ "${BASE_BRANCH}" = "claude/ruby-on-rust-v0.1" ]; then
            echo "PR target branch '${BASE_BRANCH}' is valid."
          else
            echo "::error::Invalid PR base branch '${BASE_BRANCH}'. All PRs must target 'master' or 'claude/ruby-on-rust-v0.1'."
            exit 1
          fi

