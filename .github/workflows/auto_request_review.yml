name: Auto Request Review
# Ruby on Rust: upstream-only automation, run on demand only (owner decision
# 2026-10-07; see UPSTREAM.md). Upstream's original triggers are in git history.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-request-review:
    name: Auto Request Review
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'ruby/ruby' && github.base_ref == 'master' }}
    steps:
      - name: Request review based on files changes and/or groups the author belongs to
        uses: necojackarc/auto-request-review@9a4b11888f2d60c79120c5413f13eb63febc2b68 # master
        with:
          # scope: public_repo
          token: ${{ secrets.MATZBOT_AUTO_REQUEST_REVIEW_TOKEN }}
