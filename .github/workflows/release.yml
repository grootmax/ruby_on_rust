name: Start release workflow
# Ruby on Rust: upstream-only automation, run on demand only (owner decision
# 2026-10-07; see UPSTREAM.md). Upstream's original triggers are in git history.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Build release package
        run: |
          curl -L -X POST \
            -H "Authorization: Bearer ${{ secrets.MATZBOT_GITHUB_WORKFLOW_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/ruby/actions/dispatches \
            -d "{\"event_type\": \"$GITHUB_REF\"}"
