language = "C"

autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"

tab_width = 4

usize_is_size_t = true

no_includes = true

header = """
#ifndef YJIT_H
#define YJIT_H 1

#include "ruby/internal/config.h"
#include "ruby_assert.h" // for RUBY_DEBUG
#include "vm_core.h"
#include "method.h"

#ifndef YJIT_STATS
# define YJIT_STATS (USE_YJIT && RUBY_DEBUG)
#endif

#if USE_YJIT

#if defined(_WIN32) ? defined(_M_AMD64) : (defined(__x86_64__) || defined(__aarch64__))
#else
# error YJIT unsupported platform
#endif

extern unsigned int rb_yjit_call_threshold;
extern unsigned int rb_yjit_cold_threshold;
extern uint64_t rb_yjit_live_iseq_count;
extern uint64_t rb_yjit_iseq_alloc_count;
extern uint64_t rb_yjit_max_compile_time_ns;
extern uint64_t rb_yjit_total_compile_time_ns;
extern bool rb_yjit_enabled_p;
extern bool rb_yjit_compiling_p;

void rb_yjit_invalidate_all_method_lookup_assumptions(void);
void rb_yjit_compile_iseq(const rb_iseq_t *iseq, rb_execution_context_t *ec, bool jit_exception);
"""

trailer = """
#else
// !USE_YJIT
#define rb_yjit_enabled_p false
#define rb_yjit_compiling_p false
static inline void rb_yjit_incr_counter(const char *counter_name) {}
static inline void rb_yjit_invalidate_all_method_lookup_assumptions(void) {}
static inline void rb_yjit_cme_invalidate(rb_callable_method_entry_t *cme) {}
static inline void rb_yjit_collect_binding_alloc(void) {}
static inline void rb_yjit_collect_binding_set(void) {}
static inline void rb_yjit_compile_iseq(const rb_iseq_t *iseq, rb_execution_context_t *ec, bool jit_exception) {}
static inline void rb_yjit_init_builtin_cmes(void) {}
static inline void rb_yjit_init(bool yjit_enabled) {}
static inline void rb_yjit_bop_redefined(int redefined_flag, enum ruby_basic_operators bop) {}
static inline void rb_yjit_constant_state_changed(ID id) {}
static inline void rb_yjit_iseq_mark(void *payload) {}
static inline void rb_yjit_iseq_update_references(const rb_iseq_t *iseq) {}
static inline void rb_yjit_iseq_free(const rb_iseq_t *iseq) {}
static inline void rb_yjit_invalidate_single_ractor(void) {}
static inline void rb_yjit_constant_ic_update(const rb_iseq_t *const iseq, IC ic, unsigned insn_idx) {}
static inline void rb_yjit_tracing_invalidate_all(void) {}
static inline void rb_yjit_lazy_push_frame(const VALUE *pc) {}
static inline void rb_yjit_invalidate_no_singleton_class(VALUE klass) {}
static inline void rb_yjit_invalidate_ep_is_bp(const rb_iseq_t *iseq) {}
#endif // #if USE_YJIT

#endif // YJIT_H
"""

[parse]
parse_deps = false
exclude = ["cruby"]

[export]
item_types = ["functions"]
include = [
    "rb_yjit_incr_counter",
    "rb_yjit_invalidate_all_method_lookup_assumptions",
    "rb_yjit_cme_invalidate",
    "rb_yjit_collect_binding_alloc",
    "rb_yjit_collect_binding_set",
    "rb_yjit_compile_iseq",
    "rb_yjit_init_builtin_cmes",
    "rb_yjit_init",
    "rb_yjit_free_at_exit",
    "rb_yjit_bop_redefined",
    "rb_yjit_constant_state_changed",
    "rb_yjit_iseq_mark",
    "rb_yjit_iseq_update_references",
    "rb_yjit_iseq_free",
    "rb_yjit_invalidate_single_ractor",
    "rb_yjit_constant_ic_update",
    "rb_yjit_tracing_invalidate_all",
    "rb_yjit_show_usage",
    "rb_yjit_lazy_push_frame",
    "rb_yjit_invalidate_no_singleton_class",
    "rb_yjit_invalidate_ep_is_bp",
    "rb_yjit_mark_all_writeable",
    "rb_yjit_mark_all_executable",
    "rb_yjit_c_builtin_p",
    "rb_yjit_stats_enabled_p",
    "rb_yjit_print_stats_p",
    "rb_yjit_get_stats",
    "rb_yjit_trace_exit_locations_enabled_p",
    "rb_yjit_get_exit_locations",
    "rb_yjit_record_exit_stack",
    "rb_yjit_reset_stats_bang",
    "rb_yjit_update_max_compile_time_ns",
    "rb_yjit_count_side_exit_op",
    "rb_yjit_parse_option",
    "rb_yjit_option_disable",
    "rb_yjit_iseq_gen_entry_point",
    "rb_yjit_code_gc",
    "rb_yjit_enable",
    "rb_yjit_simulate_oom_bang",
    "rb_yjit_log_enabled_p",
    "rb_yjit_get_log",
    "rb_yjit_disasm_iseq",
    "rb_yjit_insns_compiled"
]
exclude = [
    "rb_execution_context_struct",
    "rb_iseq_t",
    "rb_control_frame_struct",
    "rb_callable_method_entry_struct",
    "rb_callable_method_entry_t",
    "rb_callinfo",
    "VALUE",
    "ID",
    "IC",
    "IVC",
    "ICVARC",
    "EcPtr",
    "IseqPtr",
    "CfpPtr",
    "Reg",
    "Opnd",
    "A64Opnd",
    "A64Reg",
    "X86Reg",
    "rb_check_overloaded_cme",
    "rb_jit_iseq_mark_ep_escape_recorded",
    "rb_jit_iseq_ep_escape_recorded_p",
    "rb_float_new",
    "rb_hash_empty_p",
    "rb_str_setbyte",
    "rb_str_getbyte",
    "rb_vm_splat_array",
    "rb_jit_fix_div_fix",
    "rb_jit_fix_mod_fix",
    "rb_vm_concat_array",
    "rb_vm_get_special_object",
    "rb_vm_concat_to_array",
    "rb_vm_defined",
    "rb_vm_set_ivar_id",
    "rb_vm_setinstancevariable",
    "rb_vm_getinstancevariable",
    "rb_aliased_callable_method_entry",
    "rb_vm_getclassvariable",
    "rb_vm_setclassvariable",
    "rb_vm_ic_hit_p",
    "rb_vm_stack_canary",
    "rb_vm_push_cfunc_frame",
    "rb_obj_class",
    "rb_define_method",
    "rb_vm_objtostring",
    "rb_builtin_ary_at_end",
    "rb_builtin_ary_at",
    "rb_builtin_ary_first",
    "rb_builtin_fixnum_inc",
    "rb_str_equal",
    "rb_simple_iseq_p",
    "rb_iseq_only_kwparam_p",
    "rb_ary_new_from_args",
    "rb_gc_zjit_new_obj_fastpath",
    "memcpy"
]

[export.rename]
"IseqPtr" = "const rb_iseq_t*"
"EcPtr" = "rb_execution_context_t*"
"CfpPtr" = "rb_control_frame_t*"
"rb_callable_method_entry_struct" = "rb_callable_method_entry_t"
"rb_execution_context_struct" = "rb_execution_context_t"
"rb_control_frame_struct" = "rb_control_frame_t"
"RedefinitionFlag" = "int"
"ruby_basic_operators" = "enum ruby_basic_operators"
