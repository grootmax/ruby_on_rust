# C-to-Rust Porting Status Configuration
# Managed by developers; processed by tool/generate_porting_ledger.rb
# Valid statuses: "Not Started", "In Progress", "Ported", "Blocked", "N/A"

subsystems:
  "JIT Compiler":
    description: "Just-In-Time compilers and execution machinery"
  "Core Data Structures":
    description: "Built-in data types, objects, and core classes"
  "Virtual Machine & Execution":
    description: "Interpreter VM loop, instruction helpers, and evaluation"
  "Memory & Garbage Collection":
    description: "Garbage collector, object allocator, and memory views"
  "Concurrency & Threads":
    description: "Threading, ractors, synchronization, and scheduling"
  "Parser & AST":
    description: "Syntax parser, AST nodes, and Prism integration"
  "IO & Filesystem":
    description: "Input/Output operations, files, directories, and processes"
  "Encoding & Regex":
    description: "String encodings, transcoding, and regular expressions"
  "Utilities & Support":
    description: "Internal utility functions, tables, and system helpers"
  "Platform & Miscellaneous":
    description: "Platform stubs, runner wrappers, and target-specific code"

